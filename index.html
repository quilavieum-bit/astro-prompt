<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星読みプロンプト生成ツール</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="spark">✦</div>
      <h1>星読みプロンプト</h1>
      <p>Swiss Ephemeris 2026 準拠｜個人天体暦</p>
    </header>

    <section class="panel date-panel">
      <label for="datePicker">日付を選択</label>
      <input type="date" id="datePicker" min="2026-04-01" max="2026-12-31" />
    </section>

    <section class="planet-grid" id="planetDisplay"></section>

    <section class="button-grid">
      <button class="mode-btn" onclick="generate(1)"><span>①</span><b>今日（あわい言葉）</b><small>SNS向け・詩的な星空メッセージ</small></button>
      <button class="mode-btn" onclick="generate(2)"><span>②</span><b>今日（個人）</b><small>ネイタル×トランジット詳細</small></button>
      <button class="mode-btn" onclick="generate(3)"><span>③</span><b>今週（一般）</b><small>週間天体エネルギー概要</small></button>
      <button class="mode-btn" onclick="generate(4)"><span>④</span><b>今月（一般）</b><small>月間の流れとピーク</small></button>
      <button class="mode-btn" onclick="generate(5)"><span>⑤</span><b>今月（個人）</b><small>個人月間トランジット</small></button>
    </section>

    <section class="output-section" id="outputSection" style="display:none;">
      <div class="output-header">
        <span id="outputTitle"></span>
        <button id="copyBtn" onclick="copyOutput()">コピー</button>
      </div>
      <pre id="outputText"></pre>
      <div id="copyMsg">コピーしました</div>
    </section>
  </main>
  <script src="script.js?v=4"></script>
</body>
</html>
