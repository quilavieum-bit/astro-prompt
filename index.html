<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星読みプロンプト</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="spark">✦</div>
      <h1>星読みプロンプト</h1>
      <p>Swiss Ephemeris 2026 準拠｜個人天体暦</p>
    </header>

    <section class="card date-card">
      <label for="dateInput">日付を選択</label>
      <input id="dateInput" type="date" min="2026-04-01" max="2026-12-31" value="2026-05-26" />
      <div id="planetGrid" class="planet-grid"></div>
    </section>

    <section class="button-list">
      <button onclick="generate(1)"><span>①</span><strong>今日（あわい言葉）</strong><small>SNS向け・星データ付き</small></button>
      <button onclick="generate(2)"><span>②</span><strong>今日（個人）</strong><small>ネイタルトランジット詳細</small></button>
      <button onclick="generate(3)"><span>③</span><strong>今週（一般）</strong><small>週間天体エネルギー概要</small></button>
      <button onclick="generate(4)"><span>④</span><strong>今月（一般）</strong><small>月間テーマと流れ</small></button>
      <button onclick="generate(5)"><span>⑤</span><strong>今月（個人）</strong><small>個人月間リーディング</small></button>
    </section>

    <div id="loading" class="loading" style="display:none;">生成中...</div>

    <section id="outputSection" class="output card" style="display:none;">
      <div class="output-head">
        <h2 id="outputTitle"></h2>
        <button class="copy-btn" onclick="copyOutput()"><span>⊕</span> コピー</button>
      </div>
      <div id="aspectInfo" class="aspect-info" style="display:none;"></div>
      <pre id="outputBody"></pre>
    </section>
  </main>
  <script src="script.js?v=3"></script>
</body>
</html>
