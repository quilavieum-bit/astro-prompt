<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星読みプロンプト生成ツール</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🌙 星読みプロンプト生成</h1>

    <div class="date-section">
      <label for="datePicker">基準日（12:00 JST）</label>
      <input type="date" id="datePicker" />
      <button id="todayBtn" class="btn-small">今日</button>
    </div>

    <div class="moon-display" id="moonDisplay">月相を計算中...</div>

    <div class="buttons">
      <button class="btn" data-mode="today-personal">① 今日（個人）</button>
      <button class="btn" data-mode="today-general">② 今日（一般）</button>
      <button class="btn" data-mode="week-general">③ 今週（一般）</button>
      <button class="btn" data-mode="month-general">④ 今月（一般）</button>
      <button class="btn" data-mode="month-personal">⑤ 今月（個人）</button>
    </div>

    <div class="output-section" id="outputSection" style="display:none;">
      <div class="output-header">
        <span id="outputLabel"></span>
        <button id="copyBtn" class="btn-copy">📋 コピー</button>
      </div>
      <pre id="outputText"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
