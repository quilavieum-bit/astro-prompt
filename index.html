<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星読みプロンプト生成ツール</title>
<link rel="stylesheet" href="style.css?v=20260522-phase">
</head>
<body>
<div class="starfield" id="starfield"></div>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-symbol">✦</span>
      <h1>星読みプロンプト</h1>
      <span class="logo-symbol">✦</span>
    </div>
    <p class="subtitle">Swiss Ephemeris 2026 準拠 | 個人天体歴</p>
  </div>
</header>

<main class="container">
  <!-- 日付選択 -->
  <section class="date-section">
    <div class="date-card">
      <label for="dateInput" class="date-label">
        <span class="date-icon">◈</span> 日付を選択
      </label>
      <input type="date" id="dateInput" class="date-input"
             min="2026-04-01" max="2026-12-31" value="2026-04-18">
      <div class="planet-display" id="planetDisplay">
        <div class="planet-grid" id="planetGrid"></div>
      </div>
    </div>
  </section>

  <!-- ボタン5つ -->
  <section class="buttons-section">
    <div class="buttons-grid">
      <button class="gen-btn btn-1" data-mode="1" onclick="generate(1)">
        <span class="btn-num">①</span>
        <span class="btn-title">今日（あわい言葉）</span>
        <span class="btn-desc">SNS向け・詩的な星空メッセージ</span>
      </button>
      <button class="gen-btn btn-2" data-mode="2" onclick="generate(2)">
        <span class="btn-num">②</span>
        <span class="btn-title">今日（個人）</span>
        <span class="btn-desc">ネイタル×トランジット詳細</span>
      </button>
      <button class="gen-btn btn-3" data-mode="3" onclick="generate(3)">
        <span class="btn-num">③</span>
        <span class="btn-title">今週（一般）</span>
        <span class="btn-desc">週間天体エネルギー概要</span>
      </button>
      <button class="gen-btn btn-4" data-mode="4" onclick="generate(4)">
        <span class="btn-num">④</span>
        <span class="btn-title">今月（一般）</span>
        <span class="btn-desc">月間天体の流れ・テーマ</span>
      </button>
      <button class="gen-btn btn-5" data-mode="5" onclick="generate(5)">
        <span class="btn-num">⑤</span>
        <span class="btn-title">今月（個人）</span>
        <span class="btn-desc">あなただけの月間リーディング</span>
      </button>
    </div>
  </section>

  <!-- 出力エリア -->
  <section class="output-section" id="outputSection" style="display:none">
    <div class="output-card">
      <div class="output-header">
        <h2 class="output-title" id="outputTitle">生成結果</h2>
        <button class="copy-btn" onclick="copyOutput()">
          <span id="copyIcon">⊕</span> コピー
        </button>
      </div>
      <div class="output-body" id="outputBody"></div>
      <div class="aspect-info" id="aspectInfo"></div>
    </div>
  </section>

  <!-- ローディング -->
  <div class="loading" id="loading" style="display:none">
    <div class="loading-inner">
      <div class="loading-orb"></div>
      <p>星々を読み解いています…</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>Swiss Ephemeris 2026 | Astrodienst AG | JST 12:00基準 | 線形補間</p>
</footer>

<script src="script.js?v=20260522-phase"></script>
</body>
</html>
